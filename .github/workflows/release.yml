name: Release

on:
  workflow_run:
    workflows: [ 'CI' ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: write

jobs:
  # Version bump and release creation using Semantic Release
  prepare-release:
    name: Prepare Release with Semantic Release
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    outputs:
      new_version: ${{ steps.semantic.outputs.new_release_version }}
      published: ${{ steps.semantic.outputs.new_release_published }}
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Node.js 24
      uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install Dependencies
      run: bun install

    - name: Run Semantic Release
      id: semantic
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION_BEFORE=$(node -p "require('./package.json').version")
        npx semantic-release
        VERSION_AFTER=$(node -p "require('./package.json').version")
        if [ "$VERSION_BEFORE" = "$VERSION_AFTER" ]; then
          echo "No version bump - skipping release"
          echo "new_release_published=false" >> $GITHUB_OUTPUT
        else
          echo "new_release_version=$VERSION_AFTER" >> $GITHUB_OUTPUT
          echo "new_release_published=true" >> $GITHUB_OUTPUT
        fi

  # Build the CLI and Desktop App bundles in parallel
  build-cli:
    name: Build CLI Bundle
    needs: prepare-release
    if: ${{ needs.prepare-release.outputs.published == 'true' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: v${{ needs.prepare-release.outputs.new_version }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install Dependencies
      run: bun install

    - name: Build CLI
      run: bun run cli:build

    - name: Upload CLI Bundle
      uses: actions/upload-artifact@v7
      with:
        name: cli-bundle
        path: packages/cli/dist/
        retention-days: 1

  build-app:
    name: Build Desktop App Bundles
    needs: prepare-release
    if: ${{ needs.prepare-release.outputs.published == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          name: linux
        - os: macos-latest
          name: macos
        - os: windows-latest
          name: windows
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v6
      with:
        ref: v${{ needs.prepare-release.outputs.new_version }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install Dependencies
      run: bun install

    - name: Build App
      run: bun run app:build:stable

    - name: Upload App Bundle
      uses: actions/upload-artifact@v7
      with:
        name: app-${{ matrix.name }}
        path: packages/app/artifacts/
        retention-days: 1

  # Distribute the release artifacts
  github-release:
    name: Upload Release Assets to GitHub Release
    needs: [ build-cli, build-app, prepare-release ]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - uses: actions/download-artifact@v8
      with:
        path: all-artifacts

    - name: Upload Assets
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="v${{ needs.prepare-release.outputs.new_version }}"
        gh release upload $VERSION all-artifacts/app-*/* --clobber

  npm-publish:
    name: Publish CLI bundle to NPM
    needs: [ github-release, prepare-release ]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        ref: v${{ needs.prepare-release.outputs.new_version }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install Dependencies
      run: bun install

    - name: Publish CLI to NPM
      env:
        NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      run: |
        echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
        npm publish ./packages/cli --access public

name: Electron Test

on:
  workflow_call:

jobs:
  electron-test:
    name: Electron ${{ matrix.test-type }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Ensures all tests runs even if one type fails
      matrix:
        test-type: [unit, integration, e2e]
    
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run ${{ matrix.test-type }} tests
        run: |
          bun run test:electron:${{ matrix.test-type }}:ci

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            packages/electron/coverage/${{ matrix.test-type }}/coverage-final.json
            packages/electron/coverage/${{ matrix.test-type }}/junit.xml
          fail_ci_if_error: false
          flags: ${{ matrix.test-type }}
          verbose: true
name: App Test

on:
  workflow_call:

jobs:
  app-test:
    name: App ${{ matrix.test-type }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Ensures all tests runs even if one type fails
      matrix:
        test-type: [unit, integration]
    
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run ${{ matrix.test-type }} tests
        run: |
          bun run test:app:${{ matrix.test-type }}:ci

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            packages/app/coverage/${{ matrix.test-type }}/coverage-final.json
            packages/app/coverage/${{ matrix.test-type }}/junit.xml
          fail_ci_if_error: false
          flags: ${{ matrix.test-type }}
          verbose: true
  
  app-e2e:
    name: App E2E tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    
    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run E2E tests
        run: bun run test:electron:e2e:ci
      
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/app/coverage/e2e/junit.xml
          flags: e2e
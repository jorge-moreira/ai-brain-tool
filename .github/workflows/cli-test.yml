name: CLI Test

on:
  workflow_call:

jobs:
  cli-test:
    name: CLI ${{ matrix.test-type }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # Ensures all tests runs even if one type fails
      matrix:
        test-type: [unit, integration]
    
    steps:
      - uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run ${{ matrix.test-type }} tests
        run: |
          bun run test:cli:${{ matrix.test-type }}:ci

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            packages/cli/coverage/${{ matrix.test-type }}/coverage-final.json
            packages/cli/coverage/${{ matrix.test-type }}/junit.xml
          fail_ci_if_error: false
          flags: ${{ matrix.test-type }}
          verbose: true

      - name: Upload Test Results to Codecov
        if: always()
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            packages/core/coverage/${{ matrix.test-type }}/coverage-final.json
            packages/core/coverage/${{ matrix.test-type }}/junit.xml
          flags: ${{ matrix.test-type }}
  
  cli-e2e:
    name: CLI E2E tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'e2e')
    
    steps:
      - uses: actions/checkout@v6
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install
      - name: Run E2E tests
        run: bun run test:cli:e2e:ci
      
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/core/coverage/e2e/junit.xml
          flags: e2e